<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioTreat 污泥外运联单</title><link rel="stylesheet" href="/assets/app.css"></head>
<body><header><div class="brand">BioTreat 工艺联控</div><nav><a href="/process">工艺总控</a><a href="/aeration">曝气调节</a><a href="/sludge">污泥回流</a><a aria-current="page" href="/manifests">外运联单</a><a href="/alarms">异常处置</a></nav></header>
<main><div class="page-head"><div><h1>污泥外运联单</h1><div class="muted">排泥任务交接记录：资源释放且泵流量确认后方可结单</div></div><div class="status"><span class="dot"></span><span id="health">checking</span></div></div>
<div class="grid"><section class="panel"><h2>新建联单</h2><form id="create">
<label>处理线<select name="line_id"><option>line-1</option><option>line-2</option><option>line-3</option></select></label>
<label>沉淀池（由当前排泥任务带入）<input name="basin_hint" value="SD1" disabled></label>
<label>估计体积 (m³)<input name="estimated_volume_m3" type="number" min="0.1" step="0.1" value="12.5" required></label>
<label>承运单位<input name="receiver_company" placeholder="××环保运输有限公司" required></label>
<label>车牌号<input name="receiver_plate" placeholder="沪D·12345" required></label>
<label>驾驶员<input name="receiver_driver" placeholder="张三" required></label>
<label>联系方式<input name="receiver_contact" placeholder="13800000000"></label>
<label>交接时间 (UTC，留空为当前)<input name="handover_at" type="datetime-local" step="1"></label>
<button>开立联单</button></form></section>
<section class="panel wide"><h2>联单查询</h2><form id="filter" style="grid-template-columns:repeat(4,1fr);display:grid;gap:10px;align-items:end">
<label>处理线<select name="line_id"><option value="">全部</option><option>line-1</option><option>line-2</option><option>line-3</option></select></label>
<label>状态<select name="status"><option value="">全部</option><option value="open">待结单</option><option value="completed">已结单</option><option value="failed">失败</option></select></label>
<label>接收方<input name="receiver" placeholder="单位 / 车牌 / 驾驶员"></label>
<button>查询</button></form>
<table style="margin-top:12px"><thead><tr><th>联单号</th><th>处理线</th><th>沉淀池</th><th>泵序列</th><th>体积 m³</th><th>接收方</th><th>交接时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="manifestRows"></tbody></table></section>
<section class="panel wide"><h2>操作结果</h2><pre id="output">等待操作</pre></section></div></main>
<script src="/assets/common.js"></script><script>
const numberText = n => `WN-${String(n).padStart(6, "0")}`;
const statusText = { open: "待结单", completed: "已结单", failed: "失败" };
const fmt = t => t ? new Date(t).toLocaleString() : "—";
function buildQuery(form) {
  const p = new URLSearchParams();
  for (const [k, v] of form.entries()) if (v) p.set(k, v);
  const qs = p.toString();
  return qs ? `?${qs}` : "";
}
async function load(qs = "") {
  const data = await request(`/api/sludge/manifests${qs}`);
  document.querySelector("#manifestRows").innerHTML = data.manifests.map(m => {
    const actions = m.status === "open"
      ? `<button data-action="complete" data-id="${m.id}">结单</button> <button class="danger" data-action="fail" data-id="${m.id}">失败</button>`
      : "";
    return `<tr><td>${numberText(m.number)}</td><td>${m.line_id}</td><td>${m.basin_id}</td><td>#${m.sequence_number} ${m.pump_id}</td><td>${m.estimated_volume_m3}</td><td>${m.receiver_company}<br><span class="muted">${m.receiver_plate} / ${m.receiver_driver}</span></td><td>${fmt(m.planned_handover_at)}</td><td>${statusText[m.status] || m.status}${m.failure_reason ? `<br><span class="muted">${m.failure_reason}</span>` : ""}</td><td>${actions} <a href="/api/sludge/manifests/${m.id}/print" target="_blank">打印</a></td></tr>`;
  }).join("") || `<tr><td colspan="9" class="muted">暂无联单</td></tr>`;
}
document.querySelector("#create").addEventListener("submit", async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const body = {
    line_id: f.get("line_id"), estimated_volume_m3: Number(f.get("estimated_volume_m3")),
    receiver_company: f.get("receiver_company"), receiver_plate: f.get("receiver_plate"),
    receiver_driver: f.get("receiver_driver"), receiver_contact: f.get("receiver_contact"),
  };
  if (f.get("handover_at")) body.handover_at = new Date(f.get("handover_at")).toISOString();
  try { show(await request("/api/sludge/manifests", { method: "POST", body: JSON.stringify(body) })); await load(); }
  catch (err) { showError(err); }
});
document.querySelector("#filter").addEventListener("submit", async e => {
  e.preventDefault();
  load(buildQuery(new FormData(e.target))).catch(showError);
});
document.querySelector("#manifestRows").addEventListener("click", async e => {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const id = btn.dataset.id;
  try {
    if (btn.dataset.action === "complete") {
      show(await request(`/api/sludge/manifests/${id}/complete`, { method: "POST" }));
    } else {
      const reason = prompt("请输入失败原因（将关联停泵补偿动作）：");
      if (!reason) return;
      show(await request(`/api/sludge/manifests/${id}/fail`, { method: "POST", body: JSON.stringify({ reason }) }));
    }
    await load();
  } catch (err) { showError(err); }
});
load().catch(showError);
</script></body></html>
